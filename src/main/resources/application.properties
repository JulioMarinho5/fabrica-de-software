spring.application.name=fdso

# Banco de Dados
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fabrica_software}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:senha}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configurações de E-mail (SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:meuemail@gmail.com}
spring.mail.password=${MAIL_PASSWORD:sua_senha_aqui}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}